name: CI

# Branch flow: feature/* → dev → master.
# - Every PR runs the checks.
# - A push to dev/master (i.e. a merge) runs the checks, then applies pending
#   Drizzle migrations to that branch's Neon database.
# The Next.js build itself is not run here: Vercel already builds every PR and
# push, so a second build would only duplicate that work.
on:
  pull_request:
  push:
    branches: [dev, master]
  # Manual full-suite runs from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `next typegen` generates the route types (LayoutProps, PageProps…)
      # that `tsc` needs; they aren't committed.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  migrate:
    name: Migrate database
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # GitHub Environments "dev" and "production" each hold their own
    # DATABASE_URL secret, pointing at the matching Neon branch.
    environment: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
    # Shares the e2e group: the e2e job also runs `db:migrate` (on PRs and
    # dispatches), and two concurrent `drizzle-kit migrate` executions on the
    # same Neon database are not safe. Never cancel a migration halfway.
    concurrency:
      group: e2e-shared-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  e2e:
    name: E2E (Playwright)
    # Smoke on every PR; the full suite on dev pushes and manual dispatches.
    # Master pushes are skipped on purpose: the suite seeds a test garage in
    # the dev database, it must never write to production.
    # On pushes, wait for the migrate job (skipped instantly on PRs —
    # `always()` keeps this job alive when its need is skipped).
    needs: migrate
    if: always() && needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The suite seeds and mutates ONE shared dev garage/Clerk instance —
    # serialize all e2e runs repo-wide (the workflow-level group is per-ref,
    # so a PR smoke could otherwise overlap a dev full-suite and both would
    # reseed/delete each other's data mid-run). Tradeoff: GitHub only keeps
    # one pending job per group — a third queued run evicts the oldest
    # pending one (rerun it manually if that happens).
    concurrency:
      group: e2e-shared-dev
      cancel-in-progress: false
    # DATABASE_URL comes from the "dev" GitHub Environment; the Clerk dev
    # keys are repo/environment secrets with the same values as .env.local.
    environment: dev
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Explicit marker for the suite's destructive operations (seed --fresh,
      # teardown deletes) — never let them fall back to a production URL.
      E2E_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Environment secrets are withheld on fork PRs (and until the Clerk
      # keys are added to the "dev" environment). Skip the run instead of
      # failing red — the job summary notes it was skipped.
      - name: Check e2e secrets
        id: secrets
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && [ -n "$DATABASE_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::e2e secrets not configured — skipping Playwright run"
          fi
      # Apply the PR's pending migrations before testing — a schema-touching
      # PR fails on missing columns otherwise. Skipped on pushes: the
      # `migrate` job already applied them to the same database (this job
      # waits on it via `needs`), and running it twice concurrently is what
      # this avoids.
      - if: github.event_name != 'push' && steps.secrets.outputs.available == 'true'
        run: pnpm db:migrate
      # Production build + `next start` (see playwright.config.ts webServer):
      # no per-route cold compiles, so the suite is faster and less flaky
      # than against `next dev`. The runner's preinstalled Chrome satisfies
      # `channel: "chrome"` — no browser download needed.
      - if: steps.secrets.outputs.available == 'true'
        run: pnpm exec next build
      - name: E2E (smoke only)
        if: github.event_name == 'pull_request' && steps.secrets.outputs.available == 'true'
        run: pnpm test:e2e:smoke
      - name: E2E (full suite)
        if: github.event_name != 'pull_request' && steps.secrets.outputs.available == 'true'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results/ carries the traces and failure screenshots the
          # HTML report links to — without it the artifact has no evidence.
          path: |
            playwright-report
            test-results
          retention-days: 7
